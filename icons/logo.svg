<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c6cff"/><stop offset="1" stop-color="#3b1d8f"/>
    </linearGradient>
    <linearGradient id="n" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd166"/><stop offset="1" stop-color="#ff8a3d"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g transform="translate(256 256)">
    <circle r="180" fill="none" stroke="#fff" stroke-opacity=".22" stroke-width="20"/>

    <!-- bank (top-left) -->
    <g transform="translate(-78 -78)" fill="#fff" opacity=".95">
      <path d="M0 -34 L40 -14 H-40 Z"/>
      <rect x="-32" y="-10" width="9" height="30" rx="2"/>
      <rect x="-14" y="-10" width="9" height="30" rx="2"/>
      <rect x="5" y="-10" width="9" height="30" rx="2"/>
      <rect x="23" y="-10" width="9" height="30" rx="2"/>
      <rect x="-40" y="23" width="80" height="9" rx="3"/>
    </g>

    <!-- open book (bottom-right) -->
    <g transform="translate(80 84)" fill="none" stroke="#fff" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
      <path d="M0 -18 C-14 -28 -30 -28 -42 -22 V22 C-30 16 -14 16 0 26 Z"/>
      <path d="M0 -18 C14 -28 30 -28 42 -22 V22 C30 16 14 16 0 26 Z"/>
    </g>

    <!-- coin stack (bottom-left) -->
    <g transform="translate(-112 92)">
      <rect x="-26" y="-6" width="52" height="16" rx="8" fill="#ff9f43"/>
      <rect x="-26" y="-20" width="52" height="16" rx="8" fill="#ffb84d"/>
      <rect x="-26" y="-34" width="52" height="16" rx="8" fill="#ffd166"/>
      <path d="M-14 -26 H14" stroke="#fff" stroke-opacity=".8" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- needle -->
    <g transform="rotate(40)">
      <path d="M0 -150 L36 0 L-36 0 Z" fill="url(#n)"/>
      <path d="M0 150 L36 0 L-36 0 Z" fill="#fff"/>
    </g>
    <circle r="13" fill="#3b1d8f"/>
  </g>
</svg>
